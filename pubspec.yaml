name: health_insight_tracker
description: "Personal Health Insight Tracker — log symptoms, detect correlations, gain actionable health insights."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management (Riverpod) ──
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Firebase ──
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.4

  # ── Supabase (alternative backend — uncomment to use) ──
  # supabase_flutter: ^2.8.3

  # ── Charts ──
  fl_chart: ^0.70.2

  # ── PDF Generation ──
  pdf: ^3.11.2
  printing: ^5.14.2

  # ── Networking / AI Integration ──
  http: ^1.3.0
  dio: ^5.7.0

  # ── Local Storage ──
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Notifications ──
  flutter_local_notifications: ^18.0.1

  # ── Utilities ──
  intl: ^0.20.2
  uuid: ^4.5.1
  timezone: ^0.10.0
  path_provider: ^2.1.5

  # ── UI Enhancements ──
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
